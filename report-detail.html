<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind.css"><link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><title>Detail Laporan - LaporRusDi</title>
  <style>.detail-wrap{max-width:1100px;margin:auto;padding:34px 24px 64px}.back-link{color:#2563EB;font-weight:700;font-size:14px}.detail-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:22px}.detail-title{font-size:clamp(26px,4vw,36px);font-weight:800;line-height:1.2;color:#151E32}.info-row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #E2E8F0}.info-icon{color:#2563EB;width:20px;flex-shrink:0}.timeline-item{display:flex;gap:12px;position:relative;padding-bottom:20px}.timeline-dot{width:12px;height:12px;border-radius:50%;background:#93C5FD;border:3px solid #DBEAFE;flex-shrink:0;margin-top:4px}.comment-item{border-top:1px solid #E2E8F0;padding:16px 0}.support-number{font-size:30px;font-weight:800;color:#151E32}.photo-placeholder{min-height:190px;border-radius:14px;background:linear-gradient(135deg,#EFF6FF,#F8FAFC);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#64748B;text-align:center;padding:20px}.status-track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}.status-track span{height:5px;border-radius:99px;background:#E2E8F0}.status-track span.on{background:#3B82F6}@media(max-width:800px){.detail-grid{grid-template-columns:1fr}}
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800">
  <div id="navbar" data-active="laporan"></div>
  <main class="detail-wrap">
    <a href="reports.html" class="back-link inline-flex items-center gap-2 mb-6"><i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke daftar laporan</a>
    <div id="detail-content"></div>
  </main>
  <div id="footer"></div>
  <script src="js/data.js"></script><script src="js/common.js"></script>
  <script>
    (function(){
      var demo=[{id:'DEMO-001',title:'Dompet warna hitam',type:'hilang',category:'Aksesori',building:'Perpustakaan',room:'Lantai 2',location:'Perpustakaan lantai 2',date:'2026-10-27',status:'Menunggu',description:'Dompet kecil warna hitam kemungkinan tertinggal di area meja baca. Jika menemukan, mohon serahkan ke petugas perpustakaan atau hubungi pelapor melalui pengelola kampus.',reporterName:'Mahasiswa',contact:'Kontak melalui admin kampus'}];
      var params=new URLSearchParams(window.location.search), id=params.get('id')||'DEMO-001';
      function reports(){try{return typeof KEYS!=='undefined'&&KEYS.reports?getData(KEYS.reports):[];}catch(e){return [];}}
      var all=reports(), isDemo=all.length===0; if(isDemo)all=demo;
      var report=all.find(function(r){return String(r.id)===String(id);});
      function safe(s){return typeof escapeHtml==='function'?escapeHtml(String(s==null?'':s)):String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
      function val(r,ks,fb){for(var i=0;i<ks.length;i++)if(r[ks[i]]!==undefined&&r[ks[i]]!==null&&r[ks[i]]!=='')return r[ks[i]];return fb;}
      function typeOf(r){var t=String(val(r,['type','reportType','jenis','kind'],'')).toLowerCase();return (t.indexOf('temu')>=0||t==='found'||String(r.title||'').toLowerCase().indexOf('ditemukan')>=0)?'ditemukan':'hilang';}
      function dateText(d){if(!d)return 'Belum dicantumkan';try{return typeof formatDate==='function'?formatDate(d):new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});}catch(e){return safe(d);}}
      var commentKey=(typeof KEYS!=='undefined'&&KEYS.comments)?KEYS.comments:'laporrusdi_comments';
      var supportKey=(typeof KEYS!=='undefined'&&KEYS.supports)?KEYS.supports:'laporrusdi_supports';
      function read(key){try{return JSON.parse(localStorage.getItem(key)||'[]');}catch(e){return [];}}
      function save(key,data){localStorage.setItem(key,JSON.stringify(data));}
      if(!report){document.getElementById('detail-content').innerHTML='<div class="card empty-state"><i data-lucide="file-question" class="w-12 h-12 mx-auto mb-3"></i><h1 class="text-xl font-bold text-slate-800">Laporan tidak ditemukan</h1><p class="mt-2">Laporan mungkin sudah dihapus atau tautan yang dibuka tidak sesuai.</p><a class="btn btn-primary mt-5" href="reports.html">Lihat daftar laporan</a></div>';if(window.lucide)lucide.createIcons();return;}
      function render(){
        var type=typeOf(report),title=val(report,['title','name','itemName'],'Barang tanpa nama'),location=val(report,['location'],'')||[val(report,['building'],'Lokasi kampus'),val(report,['room','place'],'')].filter(Boolean).join(', '),status=val(report,['status'],'Menunggu');
        var comments=read(commentKey).filter(function(c){return String(c.reportId)===String(report.id);});var supports=read(supportKey);var supportCount=supports.filter(function(s){return String(typeof s==='string'?s:s.reportId)===String(report.id);}).length;
        var statusList=['Menunggu','Diverifikasi','Diproses','Selesai'], statusIndex=statusList.indexOf(status); if(statusIndex<0)statusIndex=0;
        var html='<div class="mb-6"><div class="flex flex-wrap gap-2 items-center mb-3"><span class="type-chip">Barang '+(type==='hilang'?'hilang':'ditemukan')+'</span><span class="badge badge-'+safe(status.toLowerCase())+'">'+safe(status)+'</span><span class="text-sm muted">Kode: '+safe(report.id)+'</span></div><h1 class="detail-title">'+safe(title)+'</h1><p class="muted mt-3 flex items-center gap-2"><i data-lucide="calendar-days" class="w-4 h-4"></i> Dilaporkan '+dateText(val(report,['date','createdAt'],''))+'</p></div>'+
          '<div class="detail-grid"><div class="space-y-5"><section class="card"><div class="photo-placeholder"><i data-lucide="package" class="w-12 h-12 mb-3"></i><strong class="text-slate-700">Foto barang</strong><span class="text-sm mt-1">'+(val(report,['image','photo','imageUrl'],'')?'Foto tersedia pada data laporan':'Foto belum dilampirkan')+'</span></div><h2 class="text-lg font-bold mt-6 mb-2">Deskripsi laporan</h2><p class="text-slate-600 leading-7">'+safe(val(report,['description','detail'],'Belum ada deskripsi tambahan untuk laporan ini.'))+'</p><div class="info-row mt-4"><i data-lucide="map-pin" class="info-icon"></i><div><p class="text-xs muted">Lokasi kejadian</p><p class="font-semibold">'+safe(location)+'</p></div></div><div class="info-row"><i data-lucide="tag" class="info-icon"></i><div><p class="text-xs muted">Kategori</p><p class="font-semibold">'+safe(val(report,['category'],'Belum dikategorikan'))+'</p></div></div><div class="info-row"><i data-lucide="user-round" class="info-icon"></i><div><p class="text-xs muted">Pelapor</p><p class="font-semibold">'+safe(val(report,['reporterName','userName','nameReporter'],'Pengguna kampus'))+'</p></div></div></section>'+
          '<section class="card"><div class="flex items-center justify-between gap-3"><h2 class="text-lg font-bold">Komentar dan informasi tambahan</h2><span class="type-chip" id="comment-count">'+comments.length+' komentar</span></div><p class="text-sm muted mt-2 mb-4">Bagikan informasi yang relevan agar barang lebih mudah ditemukan atau dikembalikan.</p><form id="comment-form"><label for="comment-text" class="form-label">Tulis komentar</label><textarea id="comment-text" class="form-input" rows="3" maxlength="500" placeholder="Contoh: Saya melihat barang ini di sekitar perpustakaan..." required></textarea><div class="flex justify-end mt-3"><button class="btn btn-primary" type="submit"><i data-lucide="send" class="inline w-4 h-4 mr-1"></i> Kirim komentar</button></div></form><div id="comment-list" class="mt-4"></div></section></div>'+
          '<aside class="space-y-5"><section class="card"><p class="text-sm muted">Dukungan komunitas</p><p class="support-number mt-1" id="support-count">'+supportCount+'</p><p class="text-sm text-slate-600 mt-1">orang ikut membantu laporan ini</p><button id="support-button" class="btn btn-primary w-full mt-5"><i data-lucide="heart-handshake" class="inline w-4 h-4 mr-1"></i> Dukung laporan ini</button><p class="text-xs muted mt-3">Dukungan menunjukkan bahwa informasi ini perlu diperhatikan.</p></section><section class="card"><h2 class="font-bold text-lg">Status laporan</h2><div class="status-track">'+statusList.map(function(s,i){return '<span class="'+(i<=statusIndex?'on':'')+'"></span>';}).join('')+'</div><div class="space-y-4 mt-5">'+statusList.map(function(s,i){return '<div class="timeline-item"><span class="timeline-dot" style="'+(i<=statusIndex?'background:#3B82F6;border-color:#DBEAFE':'')+'"></span><div><p class="font-semibold '+(i===statusIndex?'text-[#2563EB]':'text-slate-700')+'">'+s+'</p><p class="text-xs muted mt-1">'+(i<statusIndex?'Tahap telah dilewati':i===statusIndex?'Status saat ini':'Menunggu pembaruan')+'</p></div></div>';}).join('')+'</div></section><section class="card"><h2 class="font-bold">Butuh bantuan?</h2><p class="text-sm muted mt-2">Jika kamu pemilik barang atau punya informasi penting, hubungi pengelola kampus melalui kanal resmi.</p><a href="help.html" class="inline-flex items-center gap-2 text-[#2563EB] font-bold text-sm mt-4">Pusat bantuan <i data-lucide="arrow-up-right" class="w-4 h-4"></i></a></section></aside></div>';
        document.getElementById('detail-content').innerHTML=html;
        var commentsNow=read(commentKey).filter(function(c){return String(c.reportId)===String(report.id);});
        var commentsHtml=commentsNow.slice().reverse().map(function(c){return '<div class="comment-item"><div class="flex items-center justify-between gap-3"><p class="font-bold text-sm">'+safe(c.author||c.userName||'Pengguna kampus')+'</p><span class="text-xs muted">'+dateText(c.date)+'</span></div><p class="text-sm text-slate-600 mt-2 whitespace-pre-wrap">'+safe(c.text||c.message||'')+'</p></div>';}).join('');
        document.getElementById('comment-list').innerHTML=commentsHtml||'<div class="empty-state"><i data-lucide="messages-square" class="w-8 h-8 mx-auto mb-2"></i><p>Belum ada komentar. Jadilah yang pertama memberi informasi.</p></div>';
        document.getElementById('comment-form').addEventListener('submit',function(e){e.preventDefault();var text=document.getElementById('comment-text').value.trim();if(!text)return;var user=typeof getCurrentUser==='function'?getCurrentUser():null;var list=read(commentKey);list.push({id:'c'+Date.now(),reportId:report.id,author:user&&user.name?user.name:'Pengguna kampus',userId:user?user.id:null,text:text,date:typeof getToday==='function'?getToday():new Date().toISOString().slice(0,10)});save(commentKey,list);render();if(typeof showToast==='function')showToast('Komentar berhasil ditambahkan.','success');});
        document.getElementById('support-button').addEventListener('click',function(){var user=typeof getCurrentUser==='function'?getCurrentUser():null;var token=user?String(user.id):'guest';var current=read(supportKey);var exists=current.some(function(s){return String(s.reportId)===String(report.id)&&String(s.userId||'guest')===token;});if(exists){if(typeof showToast==='function')showToast('Kamu sudah mendukung laporan ini.','info');return;}current.push({reportId:report.id,userId:user?user.id:'guest',date:typeof getToday==='function'?getToday():new Date().toISOString().slice(0,10)});save(supportKey,current);render();if(typeof showToast==='function')showToast('Terima kasih sudah mendukung laporan ini.','success');});
        if(window.lucide)lucide.createIcons();
      }
      render();
      if(isDemo){var note=document.createElement('p');note.className='text-xs text-amber-700 mt-5';note.textContent='Mode pratinjau: detail contoh ditampilkan karena data laporan proyek belum tersedia di browser ini.';document.getElementById('detail-content').appendChild(note);}
    })();
  </script>
</body></html>
