<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind.css"><link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><title>Notifikasi - LaporRusDi</title>
  <style>.notice-wrap{max-width:1000px;margin:auto;padding:38px 24px 64px}.notice-item{display:flex;gap:15px;align-items:flex-start;padding:20px;border:1px solid #E2E8F0;border-radius:14px;background:#fff;transition:border-color .18s}.notice-item.unread{background:#F8FBFF;border-color:#BFDBFE}.notice-icon{width:46px;height:46px;display:grid;place-items:center;flex-shrink:0;border-radius:14px;background:#EFF6FF;color:#2563EB}.notice-dot{width:8px;height:8px;background:#3B82F6;border-radius:50%;display:inline-block}.notice-actions{display:flex;gap:8px;flex-wrap:wrap}.filter-tabs{display:flex;gap:8px;flex-wrap:wrap}.filter-tab{padding:9px 14px;border:1px solid #CBD5E1;border-radius:999px;background:#fff;color:#475569;font-weight:700;font-size:13px;cursor:pointer}.filter-tab.active{background:#DBEAFE;color:#1D4ED8;border-color:#93C5FD}.notice-count{font-size:12px;border-radius:999px;background:#E2E8F0;padding:3px 8px;font-weight:800}@media(max-width:600px){.notice-item{padding:15px;gap:11px}.notice-icon{width:40px;height:40px}}
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800">
  <div class="flex flex-col md:flex-row min-h-screen">
    <div id="sidebar" data-active="notifications.html"></div>
    <main class="flex-1 min-w-0">
      <div class="notice-wrap">
        <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-8"><div><p class="text-xs uppercase tracking-widest font-extrabold text-[#3B82F6] mb-2">Pembaruan akun</p><h1 class="text-3xl font-extrabold text-[#151E32]">Notifikasi</h1><p class="text-slate-500 mt-2">Pantau pembaruan laporan dan informasi terbaru di sini.</p></div><div class="notice-actions"><button id="mark-all" class="btn btn-primary">Tandai semua dibaca</button><button id="clear-read" class="btn bg-slate-100 text-slate-700">Hapus yang dibaca</button></div></div>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6"><div class="card"><p class="text-sm text-slate-500">Total notifikasi</p><p id="total-count" class="text-2xl font-extrabold text-[#151E32] mt-1">0</p></div><div class="card"><p class="text-sm text-slate-500">Belum dibaca</p><p id="unread-count" class="text-2xl font-extrabold text-[#2563EB] mt-1">0</p></div><div class="card col-span-2 md:col-span-1"><p class="text-sm text-slate-500">Sudah dibaca</p><p id="read-count" class="text-2xl font-extrabold text-[#151E32] mt-1">0</p></div></div>
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-5"><div class="filter-tabs" role="group" aria-label="Filter notifikasi"><button class="filter-tab active" data-filter="all">Semua</button><button class="filter-tab" data-filter="unread">Belum dibaca</button><button class="filter-tab" data-filter="read">Sudah dibaca</button></div><select id="sort-notices" class="form-input" style="width:auto"><option value="newest">Terbaru</option><option value="oldest">Terlama</option></select></div>
        <div id="notification-list" class="space-y-3"></div>
        <p class="text-xs text-slate-400 mt-6">Notifikasi disimpan secara lokal pada browser untuk kebutuhan prototipe.</p>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script><script src="js/common.js"></script>
  <script>
    (function(){
      var currentFilter='all';
      var demo=[{id:'demo-n1',userId:null,title:'Selamat datang di LaporRusDi',message:'Halaman notifikasi membantu kamu memantau perkembangan laporan.',date:'2026-10-28',isRead:false,reportId:null},{id:'demo-n2',userId:null,title:'Tips laporan yang baik',message:'Sertakan lokasi yang jelas dan deskripsi barang agar proses pencarian lebih mudah.',date:'2026-10-27',isRead:true,reportId:null}];
      function getList(){try{if(typeof KEYS!=='undefined'&&KEYS.notifications)return getData(KEYS.notifications);}catch(e){}try{return JSON.parse(localStorage.getItem('laporrusdi_notifications')||'[]');}catch(e){return [];}}
      function store(list){try{if(typeof KEYS!=='undefined'&&KEYS.notifications){saveData(KEYS.notifications,list);return;}}catch(e){}localStorage.setItem('laporrusdi_notifications',JSON.stringify(list));}
      var user=typeof getCurrentUser==='function'?getCurrentUser():null;
      var notifications=getList();var demoMode=notifications.length===0;if(demoMode)notifications=demo.slice();
      if(user&&notifications.length&&!demoMode){notifications=notifications.filter(function(n){return !n.userId||String(n.userId)===String(user.id);});}
      function safe(s){return typeof escapeHtml==='function'?escapeHtml(String(s==null?'':s)):String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
      function dateText(d){if(!d)return 'Tanggal tidak tersedia';try{return typeof formatDate==='function'?formatDate(d):new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});}catch(e){return safe(d);}}
      function iconFor(n){var s=(String(n.title||'')+' '+String(n.message||'')).toLowerCase();if(s.indexOf('komentar')>=0)return 'message-circle';if(s.indexOf('selesai')>=0)return 'check-circle-2';if(s.indexOf('status')>=0||s.indexOf('laporan')>=0)return 'clipboard-check';return 'bell';}
      function persist(){if(!demoMode)store(notifications);}
      function render(){
        var unread=notifications.filter(function(n){return !n.isRead;}).length;document.getElementById('total-count').textContent=notifications.length;document.getElementById('unread-count').textContent=unread;document.getElementById('read-count').textContent=notifications.length-unread;
        var list=notifications.filter(function(n){return currentFilter==='all'||(currentFilter==='unread'&&!n.isRead)||(currentFilter==='read'&&n.isRead);}).slice();list.sort(function(a,b){var da=new Date(a.date||0).getTime(),db=new Date(b.date||0).getTime();return document.getElementById('sort-notices').value==='oldest'?da-db:db-da;});
        var html=list.map(function(n){var link=n.reportId?'report-detail.html?id='+encodeURIComponent(n.reportId):'#';return '<article class="notice-item '+(!n.isRead?'unread':'')+'"><div class="notice-icon"><i data-lucide="'+iconFor(n)+'"></i></div><div class="flex-1 min-w-0"><div class="flex flex-wrap items-center gap-2"><h2 class="font-bold text-[#151E32]">'+safe(n.title||'Notifikasi')+'</h2>'+(!n.isRead?'<span class="notice-dot" title="Belum dibaca"></span>':'')+'</div><p class="text-sm text-slate-600 mt-2 leading-6">'+safe(n.message||'Tidak ada rincian tambahan.')+'</p><div class="flex flex-wrap items-center justify-between gap-3 mt-4"><span class="text-xs text-slate-400"><i data-lucide="clock-3" class="inline w-3 h-3 mr-1"></i>'+dateText(n.date)+'</span><div class="flex gap-3 text-sm font-bold"><button class="text-[#2563EB]" data-action="toggle" data-id="'+safe(n.id)+'">'+(n.isRead?'Tandai belum dibaca':'Tandai dibaca')+'</button>'+(n.reportId?'<a class="text-[#2563EB]" href="'+link+'">Lihat laporan</a>':'')+'<button class="text-slate-500" data-action="delete" data-id="'+safe(n.id)+'">Hapus</button></div></div></div></article>';}).join('');
        if(!html)html='<div class="card empty-state"><i data-lucide="bell-off" class="w-10 h-10 mx-auto mb-3"></i><h2 class="font-bold text-slate-700">Tidak ada notifikasi</h2><p class="text-sm mt-1">Notifikasi yang sesuai dengan filter ini akan muncul di sini.</p></div>';
        document.getElementById('notification-list').innerHTML=html;
        if(window.lucide)lucide.createIcons();
      }
      document.querySelectorAll('[data-filter]').forEach(function(btn){btn.addEventListener('click',function(){currentFilter=btn.getAttribute('data-filter');document.querySelectorAll('[data-filter]').forEach(function(b){b.classList.toggle('active',b===btn);});render();});});
      document.getElementById('sort-notices').addEventListener('change',render);
      document.getElementById('notification-list').addEventListener('click',function(e){var btn=e.target.closest('button[data-action]');if(!btn)return;var id=btn.getAttribute('data-id'),action=btn.getAttribute('data-action');if(action==='toggle'){notifications=notifications.map(function(n){if(String(n.id)===String(id))n.isRead=!n.isRead;return n;});}else{notifications=notifications.filter(function(n){return String(n.id)!==String(id);});}persist();render();});
      document.getElementById('mark-all').addEventListener('click',function(){notifications=notifications.map(function(n){n.isRead=true;return n;});persist();render();if(typeof showToast==='function')showToast('Semua notifikasi ditandai sudah dibaca.','success');});
      document.getElementById('clear-read').addEventListener('click',function(){var before=notifications.length;notifications=notifications.filter(function(n){return !n.isRead;});persist();render();if(typeof showToast==='function')showToast((before-notifications.length)+' notifikasi dibaca dihapus.','success');});
      render();
      if(demoMode){var note=document.createElement('p');note.className='text-xs text-amber-700 mt-4';note.textContent='Mode pratinjau: notifikasi contoh ditampilkan karena data notifikasi proyek belum tersedia di browser ini.';document.getElementById('notification-list').after(note);}
    })();
  </script>
</body></html>
