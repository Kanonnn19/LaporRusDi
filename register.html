<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - Lapor RusDi</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--light-bg); }
    .auth-wrap { min-height: calc(100vh - 78px - 260px); display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .auth-card { width: 100%; max-width: 480px; border-top: 5px solid var(--blue); }
    .auth-card h1 { color: var(--navy); margin: 0 0 6px; font-size: 28px; font-weight: 800; }
    .auth-sub { color: #64748B; margin: 0 0 24px; }
    .kolom { margin-bottom: 16px; }
    .btn-full { width: 100%; }
    .auth-foot { text-align: center; color: #64748B; font-size: 14px; margin-top: 18px; }
    .auth-foot a { color: var(--blue); font-weight: 600; }
  </style>
</head>
<body>
  <div id="navbar" data-active="register"></div>

  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>Daftar</h1>
      <p class="auth-sub">Buat akun pelapor untuk mengirim laporan kerusakan.</p>

      <form id="form-daftar" novalidate>
        <div class="kolom">
          <label class="form-label" for="nama">Nama lengkap</label>
          <input type="text" id="nama" class="form-input" placeholder="Nama lengkap" autocomplete="name">
          <div class="form-error" id="err-nama"></div>
        </div>
        <div class="kolom">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="nama@kampus.ac.id" autocomplete="username">
          <div class="form-error" id="err-email"></div>
        </div>
        <div class="kolom">
          <label class="form-label" for="telepon">Nomor telepon (opsional)</label>
          <input type="tel" id="telepon" class="form-input" placeholder="08xxxxxxxxxx" autocomplete="tel">
          <div class="form-error" id="err-telepon"></div>
        </div>
        <div class="kolom">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Minimal 6 karakter" autocomplete="new-password">
          <div class="form-error" id="err-password"></div>
        </div>
        <div class="kolom">
          <label class="form-label" for="konfirmasi">Ulangi password</label>
          <input type="password" id="konfirmasi" class="form-input" placeholder="Ulangi password" autocomplete="new-password">
          <div class="form-error" id="err-konfirmasi"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Daftar</button>
      </form>

      <p class="auth-foot">Sudah punya akun? <a href="login.html">Masuk</a></p>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script>
    var sudah = getCurrentUser();
    if (sudah !== null) { window.location.href = getDashboardPage(sudah.role); }

    var kolomForm = ["nama", "email", "telepon", "password", "konfirmasi"];
    function setError(id, pesan) {
      document.getElementById("err-" + id).textContent = pesan;
      document.getElementById(id).classList.toggle("error", pesan !== "");
    }

    document.getElementById("form-daftar").addEventListener("submit", function (e) {
      e.preventDefault();
      for (var i = 0; i < kolomForm.length; i++) { setError(kolomForm[i], ""); }

      var nama = document.getElementById("nama").value.trim();
      var email = document.getElementById("email").value.trim();
      var telepon = document.getElementById("telepon").value.trim();
      var password = document.getElementById("password").value;
      var konfirmasi = document.getElementById("konfirmasi").value;

      var ok = true;
      if (nama === "") { setError("nama", "Nama harus diisi."); ok = false; }
      if (email === "") { setError("email", "Email harus diisi."); ok = false; }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError("email", "Format email tidak valid."); ok = false; }
      if (telepon !== "" && !/^[0-9+\-\s]{8,15}$/.test(telepon)) { setError("telepon", "Nomor telepon tidak valid."); ok = false; }
      if (password.length < 6) { setError("password", "Password minimal 6 karakter."); ok = false; }
      if (konfirmasi !== password) { setError("konfirmasi", "Password tidak sama."); ok = false; }
      if (!ok) { return; }

      var users = getData(KEYS.users);
      for (var j = 0; j < users.length; j++) {
        if ((users[j].email || "").toLowerCase() === email.toLowerCase()) {
          setError("email", "Email sudah terdaftar.");
          return;
        }
      }

      var baru = { id: generateId("u"), name: nama, email: email, password: password, phone: telepon, role: "pelapor" };
      users.push(baru);
      saveData(KEYS.users, users);

      // Langsung masuk setelah mendaftar
      localStorage.setItem(KEYS.session, baru.id);
      window.location.href = getDashboardPage(baru.role);
    });
  </script>
</body>
</html>
