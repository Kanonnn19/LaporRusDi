<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Daftar Teknisi dan Penugasan | Lapor RusDi</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#F8FAFC] text-[#151E32] flex flex-col md:flex-row min-h-screen">

  <div id="sidebar" data-active="admin-technicians.html"></div>

  <main class="flex-1 p-6 md:p-8 max-w-6xl mx-auto space-y-8 w-full">
    
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-[#151E32]">Daftar Teknisi dan Penugasan</h1>
        <p class="text-slate-500 text-sm mt-1">Manajemen tim pemeliharaan fasilitas kampus Universitas Sumatera Utara.</p>
      </div>
      <button class="btn btn-primary" id="btn-tambah-teknisi" style="text-decoration: none !important;">+ Tambah Teknisi Baru</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="card flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase">Total Teknisi</p>
          <p class="text-2xl font-bold text-[#151E32] mt-1" id="kpi-total">2 Orang</p>
        </div>
      </div>
      <div class="card flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase">Standby (Siap)</p>
          <p class="text-2xl font-bold text-[#22C55E] mt-1" id="kpi-standby">1 Orang</p>
        </div>
      </div>
      <div class="card flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase">Bertugas di Lapangan</p>
          <p class="text-2xl font-bold text-[#3B82F6] mt-1" id="kpi-lapangan">1 Orang</p>
        </div>
      </div>
      <div class="card flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase">Selesai Minggu Ini</p>
          <p class="text-2xl font-bold text-[#3B82F6] mt-1">0 Perbaikan</p>
        </div>
      </div>
    </div>

    <div class="card overflow-hidden">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
        <h2 class="font-bold text-[#151E32] text-lg">Daftar Tim Teknisi</h2>
        <input type="text" id="input-cari" placeholder="Cari nama..." class="form-input max-w-md">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600 border-collapse">
          <thead>
            <tr class="border-b border-slate-100 text-slate-400 uppercase text-xs">
              <th colspan="5" class="py-3 px-2">CONTOH : AGUS SEPTIO</th>
            </tr>
          </thead>
          <tbody id="tabel-body" class="divide-y divide-slate-100">
          </tbody>
        </table>
      </div>
    </div>

    <div class="card max-w-lg">
      <h3 class="font-bold text-[#151E32] text-lg mb-4">Pembagian Tugas Perbaikan</h3>
      <form id="form-penugasan" class="space-y-4">
        <div>
          <label class="form-label">Pilih Tiket Laporan Kerusakan Fasilitas</label>
          <select id="select-laporan" class="form-input" required>
            <option value="">-- Pilih Tiket Laporan --</option>
            <option value="LRD-0001">[LRD-0001] AC Ruang Lab 3 Mati - Gedung A</option>
            <option value="LRD-0002">[LRD-0002] Kran Wastafel Bocor - Toilet Lantai 1</option>
          </select>
        </div>

        <div>
          <label class="form-label">Pilih Teknisi Penanggung Jawab</label>
          <select id="select-teknisi" class="form-input" required>
            <option value="">-- Pilih Teknisi --</option>
            <option value="TK-01">Agus Septio (Kelistrikan & AC)</option>
            <option value="TK-02">Budi Santoso (Plumbing)</option>
          </select>
        </div>

        <div>
          <label class="form-label">Catatan Tambahan Teknisi</label>
          <textarea id="catatan-admin" rows="3" placeholder="Instruksi tambahan..." class="form-input"></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-full" style="text-decoration: none !important;">Kirim Penugasan</button>
      </form>
    </div>
  </main>

  <script src="admin-technicians.js"></script>
</body>
</html>
