<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dasbor Teknisi | Lapor RusDi</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#F8FAFC] text-[#151E32] flex flex-col md:flex-row min-h-screen">

  <div id="sidebar" data-active="technician-dashboard.html"></div>

  <main class="flex-1 p-6 md:p-8 max-w-6xl mx-auto space-y-8 w-full">

    <div class="card flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-extrabold text-[#151E32]">Daftar Perbaikan</h1>
        <p class="text-slate-500 text-sm mt-1">Gunakan filter di bawah untuk memilah tugas berdasarkan status perbaikan.</p>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button id="filter-semua" class="btn btn-primary btn-sm btn-filter" style="text-decoration: none !important; background-color: #3B82F6; color: #fff;">Semua</button>
        <button id="filter-menunggu" class="btn btn-outline btn-sm btn-filter" style="text-decoration: none !important; color: #151E32; border-color: #CBD5E1;">Menunggu</button>
        <button id="filter-diproses" class="btn btn-outline btn-sm btn-filter" style="text-decoration: none !important; color: #151E32; border-color: #CBD5E1;">Diproses</button>
        <button id="filter-selesai" class="btn btn-outline btn-sm btn-filter" style="text-decoration: none !important; color: #151E32; border-color: #CBD5E1;">Selesai</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="container-tugas">
    </div>

  </main>

  <script src="technician-dashboard.js"></script>
</body>
</html>
