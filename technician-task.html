<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Perbaikan Tiket | Lapor RusDi</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#F8FAFC] text-[#151E32] font-sans">

  <header class="navbar">
    <div class="max-w-6xl mx-auto px-6 navbar-inner">
      <a href="technician-dashboard.html" class="btn btn-primary btn-sm" style="text-decoration: none !important;">Kembali ke Dasbor Teknisi</a>
      <span class="text-white font-bold text-sm">Tiket Pengerjaan: <span id="label-tiket-id">#LRD-0001</span></span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-12 space-y-6">
    
    <div class="card flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-extrabold text-[#151E32]" id="task-title">AC Ruang Lab 3 Mati</h1>
        <p class="text-slate-500 text-sm mt-1" id="task-location">Lokasi: Gedung A, Lantai 2</p>
      </div>

      <div class="flex items-center gap-2">
        <select id="select-status-task" class="form-input">
          <option value="Menunggu">Menunggu</option>
          <option value="Diproses" selected>Diproses</option>
          <option value="Selesai">Selesai</option>
        </select>
        <button id="btn-update-status" class="btn btn-primary btn-sm">Update Status</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <div class="md:col-span-2 space-y-6">
        <div class="card space-y-4">
          <h2 class="font-bold text-[#151E32] border-b pb-2">Catatan Pengerjaan Perbaikan</h2>
          <form id="form-selesai" class="space-y-4">
            <div>
              <label class="form-label">Tindakan / Penggunaan Sparepart</label>
              <textarea id="catatan-perbaikan" rows="4" placeholder="Jelaskan komponen yang diganti atau perbaikan yang telah diselesaikan..." class="form-input" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-full">Simpan & Tandai Pekerjaan Selesai</button>
          </form>
        </div>
      </div>

      <div class="card space-y-4">
        <h2 class="font-bold text-[#151E32] border-b pb-2">Status Perbaikan</h2>
        
        <div class="progress-line"><div id="progress-bar" style="width: 50%;"></div></div>
      </div>

    </div>
  </main>

  <script src="technician-task.js"></script>
</body>
</html>
